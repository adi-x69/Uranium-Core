name: Create signing key (run once)

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  keystore:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Create and commit debug.keystore if missing
        run: |
          if [ -f debug.keystore ]; then
            echo "debug.keystore already exists - nothing to do."
            exit 0
          fi
          keytool -genkeypair -v -keystore debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f debug.keystore
          git commit -m "Add fixed signing key so updates can install over old builds"
          git push
          
