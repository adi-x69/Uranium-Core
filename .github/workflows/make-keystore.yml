name: Create signing key (run once)

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  keystore:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Create and commit uranium-release.jks if missing
        run: |
          if [ -f uranium-release.jks ]; then
            echo "uranium-release.jks already exists - nothing to do."
            exit 0
          fi
          keytool -genkeypair -v -keystore uranium-release.jks \
            -keyalg RSA -keysize 2048 -validity 10000 -alias uranium \
            -storepass "@di20june09" -keypass "@di20june09" \
            -dname "CN=Uranium, OU=Dev, O=Uranium, L=City, S=State, C=IN"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f uranium-release.jks
          git commit -m "Add permanent uranium release signing keystore"
          git push
          
