name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 9.3.1

      - name: Use the fixed signing key (create a temporary one only if the repo has none)
        run: |
          if [ ! -f debug.keystore ]; then
            echo "::warning::No debug.keystore in the repo. Using a TEMPORARY key - this APK cannot update over builds signed with any other key. Run the 'Create signing key (run once)' workflow first."
            keytool -genkeypair -v -keystore debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
          fi
          echo "Signing key fingerprint (must be identical in every run):"
          keytool -list -v -keystore debug.keystore -storepass android | grep "SHA256" || true

      - name: Build Debug APK
        run: gradle assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: app/build/outputs/apk/debug/app-debug.apk
