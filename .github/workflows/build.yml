name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 9.3.1

      - name: Restore google-services.json (if missing)
        env:
          GOOGLE_SERVICES_SECRET: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          if [ ! -f app/google-services.json ]; then
            if [ -n "$GOOGLE_SERVICES_SECRET" ]; then
              echo "Restoring google-services.json from GitHub Secrets..."
              if echo "$GOOGLE_SERVICES_SECRET" | base64 -d 2>/dev/null | grep -q "project_info"; then
                echo "$GOOGLE_SERVICES_SECRET" | base64 -d > app/google-services.json
              else
                echo "$GOOGLE_SERVICES_SECRET" > app/google-services.json
              fi
            else
              echo "::warning::app/google-services.json not found in repository. Creating build fallback config..."
              cat << 'EOF' > app/google-services.json
          {
            "project_info": {
              "project_number": "305050970719",
              "project_id": "uranium-tv-core",
              "storage_bucket": "uranium-tv-core.firebasestorage.app"
            },
            "client": [
              {
                "client_info": {
                  "mobilesdk_app_id": "1:305050970719:android:c5a09e8b7c8728bc7289ea",
                  "android_client_info": {
                    "package_name": "com.uranium.tv"
                  }
                },
                "oauth_client": [],
                "api_key": [
                  {
                    "current_key": "AIzaSyAshYZdK3GcT8_r0IoJTG5uNVH1V_oCZIA"
                  }
                ],
                "services": {
                  "appinvite_service": {
                    "other_platform_oauth_client": []
                  }
                }
              }
            ],
            "configuration_version": "1"
          }
          EOF
            fi
          fi

      - name: Ensure Uranium Keystore exists
        run: |
          if [ ! -f uranium-release.jks ]; then
            echo "Generating uranium-release.jks..."
            keytool -genkeypair -v -keystore uranium-release.jks \
              -keyalg RSA -keysize 2048 -validity 10000 -alias uranium \
              -storepass "@di20june09" -keypass "@di20june09" \
              -dname "CN=Uranium, OU=Dev, O=Uranium, L=City, S=State, C=IN"
          else
            echo "uranium-release.jks found in repository."
          fi
          echo "Uranium signing key fingerprint:"
          keytool -list -v -keystore uranium-release.jks -storepass "@di20june09" | grep "SHA256" || true

          # Also ensure debug.keystore is present for the initial Gradle compile
          if [ ! -f debug.keystore ]; then
            keytool -genkeypair -v -keystore debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
          fi

      - name: Build APK
        run: gradle assembleDebug

      - name: Sign APK with Uranium Keystore
        run: |
          BUILD_TOOLS_DIR=$(ls -d $ANDROID_HOME/build-tools/* | sort -V | tail -n 1)
          echo "Using Android build-tools at $BUILD_TOOLS_DIR"
          
          # Sign app-debug.apk directly with uranium-release.jks
          $BUILD_TOOLS_DIR/apksigner sign --ks uranium-release.jks \
            --ks-key-alias uranium \
            --ks-pass "pass:@di20june09" \
            --key-pass "pass:@di20june09" \
            app/build/outputs/apk/debug/app-debug.apk
          
          echo "Verifying signature:"
          $BUILD_TOOLS_DIR/apksigner verify -v --print-certs app/build/outputs/apk/debug/app-debug.apk

          # Also create a copy named uranium-release.apk
          mkdir -p app/build/outputs/apk/release
          cp app/build/outputs/apk/debug/app-debug.apk app/build/outputs/apk/release/uranium-release.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: app/build/outputs/apk/debug/app-debug.apk

      - name: Upload Release APK
        uses: actions/upload-artifact@v4
        with:
          name: uranium-release-apk
          path: app/build/outputs/apk/release/uranium-release.apk

      - name: Upload keystore
        uses: actions/upload-artifact@v4
        with:
          name: uranium-keystore
          path: uranium-release.jks
